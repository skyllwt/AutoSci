name: Daily arXiv recommendation

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      hours:
        description: Lookback window in hours
        required: false
        default: ''
      categories:
        description: Optional categories separated by spaces or commas
        required: false
        default: ''
      max_recommendations:
        description: Maximum recommendations
        required: false
        default: ''
      send_email:
        description: Send the digest by SMTP
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: daily-arxiv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  recommend:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      LLM_FALLBACK_MODEL: ${{ secrets.LLM_FALLBACK_MODEL }}
      SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
      DEEPXIV_TOKEN: ${{ secrets.DEEPXIV_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Resolve configuration and prepare data
        env:
          INPUT_HOURS: ${{ github.event.inputs.hours }}
          INPUT_CATEGORIES: ${{ github.event.inputs.categories }}
          INPUT_MAX: ${{ github.event.inputs.max_recommendations }}
        run: |
          set -euo pipefail
          mkdir -p .daily-arxiv/run
          args=(prepare --config config/daily-arxiv.yml --out-feed .daily-arxiv/run/feed.json --wiki-root wiki --out .daily-arxiv/run/context.json)
          [ -z "${INPUT_HOURS:-}" ] || args+=(--hours "$INPUT_HOURS")
          [ -z "${INPUT_MAX:-}" ] || args+=(--max-recommendations "$INPUT_MAX")
          if [ -n "${INPUT_CATEGORIES:-}" ]; then
            normalized="${INPUT_CATEGORIES//,/ }"
            read -r -a cats <<< "$normalized"
            args+=(--categories "${cats[@]}")
          fi
          python tools/daily_arxiv.py "${args[@]}"
      - name: Recommend with OpenAI-compatible LLM
        id: llm
        continue-on-error: true
        run: python tools/daily_arxiv.py recommend-llm --context .daily-arxiv/run/context.json --out .daily-arxiv/run/decisions.json
      - name: Finalize recommendation digest
        if: always()
        run: |
          args=(finalize --context .daily-arxiv/run/context.json --out-md .daily-arxiv/run/digest.md --out-json .daily-arxiv/run/digest.json)
          [ ! -s .daily-arxiv/run/decisions.json ] || args+=(--decisions .daily-arxiv/run/decisions.json)
          python tools/daily_arxiv.py "${args[@]}"
          cat .daily-arxiv/run/digest.md >> "$GITHUB_STEP_SUMMARY"
      - name: Send optional email
        if: always() && (github.event_name != 'workflow_dispatch' || github.event.inputs.send_email == 'true')
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DAILY_ARXIV_EMAIL_TO: ${{ secrets.SMTP_TO }}
        run: python tools/send_email.py --subject "AutoSci daily arXiv" --body-file .daily-arxiv/run/digest.md
      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-arxiv-${{ github.run_id }}
          path: .daily-arxiv/run/
          if-no-files-found: error

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt -r mcp-servers/llm-review/requirements.txt
      - name: Validate OpenCode migration
        run: python tools/validate_opencode_migration.py
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s .sleepcode/tests -v
      - name: Wiki lint
        run: python tools/lint.py --wiki-dir wiki/
      - name: Whitespace
        run: git diff --check
